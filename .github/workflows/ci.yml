name: CI

on:
  pull_request:
  push:
    branches: [app, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t greencity-web:ci ./app

      - name: Build api image
        run: docker build -t greencity-api:ci ./backend
