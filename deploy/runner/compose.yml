name: greencity-runner

services:
  runner:
    build:
      context: .
    image: greencity-runner:latest
    container_name: greencity-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/HelloX3030/green-city
      RUNNER_NAME: raspberrypi5
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      LABELS: greencity,linux,ARM64
      RUNNER_WORKDIR: /home/parsa/greencity-ci/_work
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/parsa/greencity-ci:/home/parsa/greencity-ci
    command: >
      bash -c '
        if [ ! -f .runner ]; then
          ./config.sh --unattended --replace --url "$$REPO_URL" --token "$$RUNNER_TOKEN"
            --name "$$RUNNER_NAME" --labels "$$LABELS" --work "$$RUNNER_WORKDIR";
        fi;
        exec ./run.sh
      '
